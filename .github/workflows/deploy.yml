name: EA Platform UI — Deploy

# Auto-deploy-on-push disabled — this team currently deploys the frontend
# manually via `gcloud run deploy` from Cloud Shell (see repo docs / team
# runbook). Switched to workflow_dispatch so this stays available to run
# by hand from the Actions tab without racing the manual deploy on every
# push to master. Re-enable the `push` trigger if/when the team moves to
# CI-driven deploys.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          REACT_APP_API_URL: https://ea-platform-api-7omywjptqq-ww.a.run.app/api/v1
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ea-platform-ui \
            --source . \
            --region me-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --cpu 1 \
            --memory 512Mi \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --quiet
